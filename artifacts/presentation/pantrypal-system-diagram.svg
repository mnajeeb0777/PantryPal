<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">PantryPal class architecture</title><desc id="description">PantryPalGUI contains RecipeImportPanel and BrokeModePanel. These views call PantryPalController. The controller owns Pantry and RecipeBook, coordinates RecipeMatcher and IngredientMatcher, saves PantryPalData through DataStore, and uses RecipeImporter and PriceFinder for external services. Selected class relationships and methods are shown.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#598565" stroke-width="1.6" stroke-linejoin="round"/></marker></defs><rect width="1920" height="1080" fill="#F7FAF5"/>
